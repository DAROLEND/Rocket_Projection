<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Rocket Trajectory Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rocket Trajectory Viewer</h1>

    <div class="page-content">
        <div class="controls">
            <select id="simSelect" onchange="loadSimulation()">
                <option value="">Завантаження списку...</option>
            </select>
            <button id="restartBtn" onclick="restart()" disabled>↺ Спочатку</button>
            <button id="playBtn" onclick="togglePlay()" disabled>▶ Play</button>
            <button id="createToggleBtn" onclick="toggleCreateMode()">+ Нова симуляція</button>
            <button id="compareToggleBtn" onclick="toggleCompareMode()">Порівняти</button>
            <button id="editBtn" onclick="openEditMode()" disabled title="Редагувати поточну симуляцію">Редагувати</button>
            <button id="deleteBtn" onclick="deleteSimulation()" class="delete-btn" disabled>Видалити</button>
            <label class="speed-label">
                Швидкість: <span id="speedValue">x1.0</span>
                <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1" oninput="updateSpeedLabel()">
            </label>
            <label class="scale-toggle">
                <input type="checkbox" id="fixedScale" onchange="loadSimulation()">
                Фіксований масштаб
            </label>
        </div>

        <div id="createPanel" class="create-panel">
            <div class="create-header">
                <span id="createHeaderTitle">Параметри нової симуляції:</span>
                <span id="createNote" class="create-note"></span>
                <span id="createError" class="create-error"></span>
            </div>
            <div class="create-fields">
                <label>
                    <span class="field-label-text">Маса, кг
                        <span class="field-tip">ⓘ<span class="field-tip-content">Маса ракети. Якщо додаєш двигун - це маса разом із паливом на старті (паливо потім вигорає).</span></span>
                    </span>
                    <input type="number" id="createMass" step="0.01" min="0.01" value="0.5">
                </label>
                <label>
                    <span class="field-label-text">Швидкість, м/с
                        <span class="field-tip">ⓘ<span class="field-tip-content">Початкова швидкість у момент старту. Якщо додаєш двигун - тяга додасться до цієї швидкості під час горіння.</span></span>
                    </span>
                    <input type="number" id="createV0" step="0.1" min="0.1" value="40">
                </label>
                <label>
                    <span class="field-label-text">Кут, °
                        <span class="field-tip">ⓘ<span class="field-tip-content">Кут запуску відносно горизонту, 0–90°. Двигун (якщо є) штовхає рівно в цьому напрямку.</span></span>
                    </span>
                    <input type="number" id="createAngle" step="1" min="0" max="90" value="45">
                </label>
                <label>
                    <span class="field-label-text">Коеф. опору
                        <span class="field-tip">ⓘ<span class="field-tip-content">Коефіцієнт аеродинамічного опору (Cd). Типово 0.3–0.5 для невеликої ракети - більше значення = більше гальмування повітрям.</span></span>
                    </span>
                    <input type="number" id="createDrag" step="0.01" min="0.01" value="0.47">
                </label>
                <label>
                    <span class="field-label-text">Площа перерізу, м²
                        <span class="field-tip">ⓘ<span class="field-tip-content">Площа поперечного перерізу ракети. Разом з Cd визначає силу опору повітря: більша площа - більше гальмування.</span></span>
                    </span>
                    <input type="number" id="createArea" step="0.001" min="0.001" value="0.03">
                </label>
                <label>
                    <span class="field-label-text">Метод інтегрування
                        <span class="field-tip">ⓘ<span class="field-tip-content"><b>Euler</b> (напівнеявний) - простий і швидкий, але накопичує похибку з кожним кроком. <b>RK4</b> (Runge-Kutta 4-го порядку) - обчислює 4 проміжні оцінки сили на крок і набагато точніший, особливо при грубому кроці часу чи довгому польоті.</span></span>
                    </span>
                    <select id="createMethod">
                        <option value="euler">Euler</option>
                        <option value="rk4">RK4</option>
                    </select>
                </label>
            </div>

            <div class="create-extra-toggles">
                <label class="create-checkbox">
                    <input type="checkbox" id="toggleEngine" onchange="toggleEngineFields()"> Двигун (тяга + паливо)
                    <span class="field-tip">ⓘ<span class="field-tip-content">Додає фазу активного розгону: двигун штовхає ракету постійною тягою протягом часу горіння, а маса рівномірно зменшується на масу палива. Без цього - чиста балістика від готової початкової швидкості.</span></span>
                </label>
                <label class="create-checkbox">
                    <input type="checkbox" id="toggleParachute" onchange="toggleParachuteFields()"> Парашут
                    <span class="field-tip">ⓘ<span class="field-tip-content">Інший (зазвичай значно більший) коефіцієнт опору й площа, що автоматично «розкриваються» в момент початку падіння - тобто на апогеї, коли вертикальна швидкість переходить у мінус.</span></span>
                </label>
                <label class="create-checkbox" id="dispersionToggleLabel">
                    <input type="checkbox" id="toggleDispersion" onchange="toggleDispersionFields()"> Monte Carlo розкид замість одного запуску
                    <span class="field-tip">ⓘ<span class="field-tip-content">Замість одної траєкторії - прогонить N симуляцій з випадковим шумом на кут і швидкість, і покаже розкид точок приземлення (середнє і стандартне відхилення) замість анімації польоту.</span></span>
                </label>
            </div>

            <div id="engineFields" class="create-fields hidden">
                <label>
                    <span class="field-label-text">Тяга, Н
                        <span class="field-tip">ⓘ<span class="field-tip-content">Сила тяги двигуна в Ньютонах. Діє вздовж напрямку старту протягом усього часу горіння.</span></span>
                    </span>
                    <input type="number" id="createThrust" step="1" min="0.1" value="60">
                </label>
                <label>
                    <span class="field-label-text">Час горіння, с
                        <span class="field-tip">ⓘ<span class="field-tip-content">Скільки секунд двигун працює із заданою тягою. Після цього - вільний політ (балістика).</span></span>
                    </span>
                    <input type="number" id="createBurnTime" step="0.1" min="0.1" value="2">
                </label>
                <label>
                    <span class="field-label-text">Маса палива, кг
                        <span class="field-tip">ⓘ<span class="field-tip-content">Скільки маси згорає за час горіння. Має бути меншою за загальну масу ракети (інакше суха маса вийде ≤ 0).</span></span>
                    </span>
                    <input type="number" id="createPropellant" step="0.01" min="0.01" value="0.1">
                </label>
            </div>

            <div id="parachuteFields" class="create-fields hidden">
                <label>
                    <span class="field-label-text">Коеф. опору парашута
                        <span class="field-tip">ⓘ<span class="field-tip-content">Cd парашута в розкритому стані - зазвичай значно вищий за Cd самої ракети (типово 1.0–2.0).</span></span>
                    </span>
                    <input type="number" id="createParaCd" step="0.1" min="0.1" value="1.5">
                </label>
                <label>
                    <span class="field-label-text">Площа парашута, м²
                        <span class="field-tip">ⓘ<span class="field-tip-content">Площа парашута в розкритому стані - значно більша за переріз самої ракети, тому й гальмує сильніше.</span></span>
                    </span>
                    <input type="number" id="createParaArea" step="0.01" min="0.01" value="0.3">
                </label>
            </div>

            <div id="dispersionFields" class="create-fields hidden">
                <label>
                    <span class="field-label-text">К-сть прогонів
                        <span class="field-tip">ⓘ<span class="field-tip-content">Скільки симуляцій прогнати (10–500). Більше прогонів - точніша статистика розкиду, але довше рахується.</span></span>
                    </span>
                    <input type="number" id="createTrials" step="10" min="10" max="500" value="200">
                </label>
                <label>
                    <span class="field-label-text">Шум кута, °
                        <span class="field-tip">ⓘ<span class="field-tip-content">Стандартне відхилення випадкової похибки кута запуску між прогонами (імітує неточність реального пуску).</span></span>
                    </span>
                    <input type="number" id="createAngleStd" step="0.1" min="0" value="1">
                </label>
                <label>
                    <span class="field-label-text">Шум швидкості, %
                        <span class="field-tip">ⓘ<span class="field-tip-content">Стандартне відхилення випадкової похибки початкової швидкості, у відсотках від значення v0.</span></span>
                    </span>
                    <input type="number" id="createV0Std" step="0.5" min="0" value="2">
                </label>
            </div>

            <div class="create-actions">
                <button id="createOptimalBtn" onclick="findOptimalAngle()" title="Знайти кут з максимальною дальністю (golden-section search)">Оптимальний кут</button>
                <button id="createSubmitBtn" onclick="submitCreateSimulation()">▶ Запустити</button>
                <button onclick="exitCreateMode()">✕ Скасувати</button>
            </div>
        </div>

        <div id="comparePanel" class="compare-panel">
            <div class="compare-header">
                <span>Обери 2–6 симуляцій:</span>
                <span id="compareCount" class="compare-count">0 обрано</span>
                <button onclick="applyCompare()">Показати порівняння</button>
                <button onclick="exitCompareMode()">✕ Вийти</button>
            </div>
            <div id="compareCheckboxes" class="compare-checkboxes"></div>
        </div>

        <p id="info"></p>

        <div class="viewer-layout">
            <div class="canvas-wrapper">
                <canvas id="canvas" width="700" height="420"></canvas>
                <div id="compareLegend" class="compare-legend hidden"></div>
            </div>
            <div class="side-panel">
                <div class="telemetry" id="telemetryPanel">
                    <h3>Телеметрія</h3>
                    <div id="telemetrySingle">
                        <div class="telemetry-row">
                        <span>Час</span>
                        <input type="number" id="telTimeInput" step="0.01" min="0" value="0" class="telemetry-input">
                        </div>
                        <div class="telemetry-row"><span>Висота (y)</span><strong id="telY">0.00 м</strong></div>
                        <div class="telemetry-row"><span>Дальність (x)</span><strong id="telX">0.00 м</strong></div>
                        <div class="telemetry-row"><span>Швидкість</span><strong id="telSpeed">0.00 м/с</strong></div>
                        <div class="telemetry-row"><span>Vx</span><strong id="telVx">0.00 м/с</strong></div>
                        <div class="telemetry-row"><span>Vy</span><strong id="telVy">0.00 м/с</strong></div>
                    </div>
                    <div id="telemetryCompare" class="hidden"></div>
                </div>

                <div class="chat">
                    <div class="chat-header">
                        <h3>Чат</h3>
                        <div class="mode-toggle">
                            <button id="modeAskBtn" class="mode-btn active" onclick="setChatMode('ask')">Питання</button>
                            <button id="modeAgentBtn" class="mode-btn" onclick="setChatMode('agent')">Агент</button>
                            <button id="chatResetBtn" class="mode-btn" onclick="resetAgentChat()" title="Почати новий діалог (агент забуде контекст)">↺ Новий діалог</button>
                        </div>
                    </div>
                    <div id="chatMessages" class="chat-messages">
                        <div class="chat-placeholder" id="chatPlaceholder">Запитай про дані або попроси запустити нову симуляцію</div>
                    </div>
                    <div class="chat-input-row">
                        <input type="text" id="chatInput" placeholder="Твоє питання..." onkeydown="handleChatKeydown(event)">
                        <button id="chatSendBtn" onclick="sendChatMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
