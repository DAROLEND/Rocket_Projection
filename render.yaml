# Render Blueprint — deploy Rocket Trajectory API for free.
#
# Auto-deploy on push needs Render's GitHub App to actually have access
# to this repo (Configure it at https://github.com/settings/installations
# -> Render -> "All repositories", or add this repo explicitly under
# "Only select repositories") — otherwise every push needs a manual
# "Deploy latest commit" in the Render dashboard.
#
# What this deploys:
#   - a free Web Service running the existing Dockerfile (uvicorn)
# What it does NOT deploy:
#   - the database — bring your own free Postgres (Supabase, Neon, ...).
#     The service just connects to it over the network via DB_*. On boot
#     it creates the schema itself (no Alembic here, just a lightweight
#     ad-hoc migration — see app/database.py) against a fresh, empty
#     database, and re-derives the ChromaDB search index from whatever
#     simulations are already in Postgres — so the free instance having
#     no persistent disk for chroma_data/ doesn't actually lose anything.
#   - DB_* left unset entirely falls back to a local SQLite file instead,
#     which *does* reset on every redeploy/restart — fine for a quick
#     look, not for anything you want to survive a deploy.

services:
  - type: web
    name: rocket-projection
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard after first deploy
      - key: DB_HOST
        sync: false # e.g. Supabase's db.<project-ref>.supabase.co, or Neon's host
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
